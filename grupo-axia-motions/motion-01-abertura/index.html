<!doctype html>
<!-- Grupo Axia · Motion 01 · Abertura · 2.5s · 1080×1920 · 30 fps -->
<html lang="pt-BR" data-composition-variables='[{"id": "fundo", "type": "boolean", "label": "Fundo sólido (insert de tela cheia)", "default": true}, {"id": "overlayY", "type": "number", "label": "Overlay: centro vertical do painel", "default": 960, "min": 500, "max": 1500, "step": 10, "unit": "px"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Motion 01 · Abertura</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>

      #m1-panel { padding-top: 64px; padding-bottom: 64px; }
      #m1-line { width: 100%; margin-bottom: 56px; }
      #m1-tick { position: absolute; left: var(--panel-pad); top: 64px; width: 72px; height: 6px; margin-top: -2.5px; background: var(--brand-200); transform-origin: left center; }
      .mode-full #m1-tick { left: 0; }
      .m1-l { font-size: 148px; }
      #m1-num { font-size: 300px; line-height: 0.9; letter-spacing: -0.04em; color: var(--brand-200); margin-top: 8px; transform-origin: left 70%; }
      #m1-sub { margin-top: 56px; font-size: 52px; font-weight: 500; letter-spacing: -0.005em; line-height: 1.18; text-transform: uppercase; }
      .mode-overlay .m1-l { font-size: 112px; }
      .mode-overlay #m1-num { font-size: 230px; }
      .mode-overlay #m1-sub { font-size: 42px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
        <img class="bg-logo" src="assets/axia-logo-white.svg" alt="Grupo Axia" />
        <div class="bg-rule top"></div>
        <div class="bg-rule bottom"></div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="anchor"><div class="panel" id="m1-panel">
          <div class="rule" id="m1-line"></div>
          <div id="m1-tick"></div>
          <h1 class="title">
            <span class="mask m1-l"><span id="m1-l1">Fim da</span></span>
            <span class="mask m1-l"><span id="m1-l2">escala</span></span>
          </h1>
          <div class="title" id="m1-num">6×1?</div>
          <p id="m1-sub"><span class="mask"><span id="m1-s1">O que muda para</span></span><span class="mask"><span id="m1-s2">sua empresa?</span></span></p>
        </div></div>
      </div>
    </div>
    <script src="assets/axia-kit.js"></script>
    <script>
      const V = AxiaKit.setup({ fundo: true, overlayY: 960 });
      const tl = gsap.timeline({ paused: true });

      // 0,0–0,3 · linhas institucionais
      if (V.fundo) AxiaKit.bgIn(tl, 0);
      tl.fromTo("#m1-panel", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
      tl.fromTo("#m1-line", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.02);
      tl.fromTo("#m1-tick", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 0.12);
      // 0,3–0,9 · FIM DA ESCALA por máscara horizontal
      tl.fromTo(["#m1-l1", "#m1-l2"], { clipPath: "inset(0% 100% 0% 0%)", x: -24 },
        { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.5, ease: "expo.out", stagger: 0.1 }, 0.3);
      // 0,9–1,3 · 6×1? com mais peso, scale 94% → 100%
      tl.fromTo("#m1-num", { opacity: 0, scale: 0.94, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 0.9);
      // texto secundário
      tl.fromTo(["#m1-s1", "#m1-s2"], { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "expo.out", stagger: 0.07 }, 1.05);
      // 1,3–2,2 · leitura · 2,2–2,5 · saída
      tl.to(["#m1-l1", "#m1-l2", "#m1-num", "#m1-s1", "#m1-s2"], { y: -36, opacity: 0, duration: 0.22, ease: "power3.in", stagger: 0.025 }, 2.2);
      tl.to(["#m1-line", "#m1-tick"], { scaleX: 0, duration: 0.22, ease: "power3.in" }, 2.22);
      if (!V.fundo) tl.to("#m1-panel", { opacity: 0, duration: 0.15, ease: "power2.in" }, 2.32);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
