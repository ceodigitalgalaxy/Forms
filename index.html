<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Formulário</title>
  <meta name="description" content="Formulário">
  <meta name="theme-color" content="#000000">
  <link rel="icon" id="favicon" href="">
  <link rel="apple-touch-icon" id="apple-icon" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>

  <header class="brand">
    <a id="brand-link" class="brand__link" href="#" target="_blank" rel="noopener">
      <img id="brand-logo" class="brand__logo" src="" alt="">
      <span id="brand-name" class="brand__name"></span>
    </a>
  </header>

  <main>
    <form id="lead-form" novalidate>
      <!-- Tela de boas-vindas -->
      <section class="step step--welcome is-active" tabindex="-1">
        <div class="step__inner">
          <img id="welcome-logo" class="welcome__logo" src="" alt="">
          <h1 id="headline" class="welcome__title"></h1>
          <p id="subheadline" class="welcome__text"></p>
          <div class="step__actions">
            <button type="button" class="btn" data-action="next" id="start-btn"></button>
            <span class="step__hint">pressione <strong>Enter ↵</strong></span>
          </div>
          <p id="welcome-hint" class="welcome__hint"></p>
        </div>
      </section>

      <!-- Perguntas (geradas a partir de config.js) -->
      <div id="steps"></div>

      <!-- Anti-spam (honeypot): invisível para humanos -->
      <div class="hp" aria-hidden="true">
        <label>Não preencha <input type="text" name="_hp" tabindex="-1" autocomplete="off"></label>
      </div>
    </form>

    <!-- Tela final -->
    <section id="success-view" class="step step--end" tabindex="-1" aria-live="polite">
      <div class="step__inner">
        <div class="end__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 id="success-title" class="welcome__title"></h2>
        <p id="success-message" class="welcome__text"></p>
      </div>
    </section>
  </main>

  <nav class="nav" id="nav" hidden aria-label="Navegação entre perguntas">
    <button type="button" class="nav__btn" id="nav-prev" aria-label="Pergunta anterior">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="nav__btn" id="nav-next" aria-label="Próxima pergunta">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <script src="assets/app.js"></script>
</body>
</html>
