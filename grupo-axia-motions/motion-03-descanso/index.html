<!doctype html>
<!-- Grupo Axia · Motion 03 · Dois dias de descanso · 2.5s · 1080×1920 · 30 fps -->
<html lang="pt-BR" data-composition-variables='[{"id": "fundo", "type": "boolean", "label": "Fundo sólido (insert de tela cheia)", "default": false}, {"id": "overlayY", "type": "number", "label": "Overlay: centro vertical do painel", "default": 1300, "min": 500, "max": 1500, "step": 10, "unit": "px"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Motion 03 · Dois dias de descanso</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>

      #m3-title { font-size: 64px; margin-bottom: 44px; }
      #m3-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
      .m3-day { height: 132px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-soft); }
      #m3-legend { display: flex; gap: 40px; margin-top: 32px; align-items: center; }
      .m3-key { display: flex; align-items: center; gap: 14px; font-size: 28px; color: var(--white); }
      .m3-key i { width: 22px; height: 22px; border-radius: 6px; display: block; }
      #m3-k-work i { background: var(--brand-700); border: 1px solid rgba(255,255,255,0.35); }
      #m3-k-rest i { background: var(--brand-200); }
      #m3-note { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--hair); }
      .mode-full #m3-title { font-size: 72px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
        <img class="bg-logo" src="assets/axia-logo-white.svg" alt="Grupo Axia" />
        <div class="bg-rule top"></div>
        <div class="bg-rule bottom"></div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="anchor"><div class="panel" id="m3-panel">
          <h2 class="title" id="m3-title"><span class="mask"><span id="m3-t"><span class="accent">2 dias</span> de descanso</span></span></h2>
          <div id="m3-week">
            <div class="m3-day work" id="m3-d1">SEG</div>
            <div class="m3-day work" id="m3-d2">TER</div>
            <div class="m3-day work" id="m3-d3">QUA</div>
            <div class="m3-day work" id="m3-d4">QUI</div>
            <div class="m3-day work" id="m3-d5">SEX</div>
            <div class="m3-day rest" id="m3-d6">SÁB</div>
            <div class="m3-day rest" id="m3-d7">DOM</div>
          </div>
          <div id="m3-legend">
            <div class="m3-key" id="m3-k-work"><i></i>Trabalho</div>
            <div class="m3-key" id="m3-k-rest"><i></i>Descanso</div>
          </div>
          <p class="note" id="m3-note">Exemplo ilustrativo. As folgas variam por setor.</p>
        </div></div>
      </div>
    </div>
    <script src="assets/axia-kit.js"></script>
    <script>
      const V = AxiaKit.setup({ fundo: false, overlayY: 1300 });
      const tl = gsap.timeline({ paused: true });

      if (V.fundo) AxiaKit.bgIn(tl, 0);
      // 0,0–0,4 · painel e os sete dias
      tl.fromTo("#m3-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo(".m3-day", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", stagger: 0.035 }, 0.05);
      // 0,4–1,2 · cinco dias trabalhados em sequência
      tl.fromTo(".m3-day.work", { backgroundColor: "rgba(11,99,71,0)", color: "#c7d1cb", borderColor: "rgba(255,255,255,0.22)" },
        { backgroundColor: "rgba(11,99,71,1)", color: "#ffffff", borderColor: "rgba(255,255,255,0.35)", duration: 0.22, ease: "power2.out", stagger: 0.14 }, 0.4);
      tl.fromTo("#m3-k-work", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.6);
      // 1,2–1,7 · dois dias de descanso em outro estado
      tl.fromTo(".m3-day.rest", { backgroundColor: "rgba(160,228,147,0)", color: "#c7d1cb", borderColor: "rgba(255,255,255,0.22)" },
        { backgroundColor: "rgba(160,228,147,1)", color: "#033223", borderColor: "rgba(160,228,147,1)", duration: 0.3, ease: "power2.out", stagger: 0.12 }, 1.2);
      tl.fromTo("#m3-k-rest", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.3);
      tl.fromTo("#m3-note", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.45);
      // 1,7–2,2 · título
      tl.fromTo("#m3-t", { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 1.7);
      // 2,2–2,5 · saída
      tl.to("#m3-panel", { opacity: 0, y: -12, duration: 0.24, ease: "power2.in" }, 2.2);
      if (V.fundo) tl.to("#bg .bg-rule", { scaleX: 0, duration: 0.24, ease: "power2.in" }, 2.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
