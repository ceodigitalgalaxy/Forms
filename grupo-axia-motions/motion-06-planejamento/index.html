<!doctype html>
<!-- Grupo Axia · Motion 06 · Planejamento empresarial · 3.0s · 1080×1920 · 30 fps -->
<html lang="pt-BR" data-composition-variables='[{"id": "fundo", "type": "boolean", "label": "Fundo sólido (insert de tela cheia)", "default": true}, {"id": "overlayY", "type": "number", "label": "Overlay: centro vertical do painel", "default": 1240, "min": 500, "max": 1500, "step": 10, "unit": "px"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Motion 06 · Planejamento empresarial</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>

      #m6-title { font-size: 104px; margin-bottom: 56px; }
      #m6-list { border-top: 1px solid var(--hair); }
      .m6-item { display: flex; align-items: center; gap: 32px; padding: 34px 0; border-bottom: 1px solid var(--hair); }
      .m6-check { width: 64px; height: 64px; stroke-width: 2.2; flex: none; overflow: visible; }
      .m6-text { font-size: 44px; font-weight: 600; letter-spacing: -0.005em; text-transform: uppercase; white-space: nowrap; }
      #m6-sign { display: flex; align-items: center; justify-content: space-between; margin-top: 48px; }
      #m6-logo { width: 150px; height: auto; display: block; }
      #m6-url { font-size: 28px; color: var(--ink-soft); letter-spacing: 0.02em; }
      .mode-overlay #m6-title { font-size: 72px; margin-bottom: 36px; }
      .mode-overlay .m6-item { padding: 26px 0; }
      .mode-overlay .m6-text { font-size: 38px; }
      .mode-overlay .m6-check { width: 54px; height: 54px; }
      .mode-overlay #m6-sign { margin-top: 36px; }
      .mode-overlay #m6-logo { width: 120px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.0" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="3.0" data-track-index="0">
        <div class="bg-rule top"></div>
        <div class="bg-rule bottom"></div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="3.0" data-track-index="1">
        <div class="anchor"><div class="panel" id="m6-panel">
          <h2 class="title" id="m6-title"><span class="mask"><span id="m6-t1">Prepare sua</span></span><span class="mask"><span id="m6-t2" class="accent">empresa</span></span></h2>
          <div id="m6-list">
            <div class="m6-item" id="m6-i1">
              <svg class="line-icon m6-check" viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="32" cy="32" r="29" pathLength="1" />
                <path d="M20 33l8 8l16-17" pathLength="1" />
              </svg>
              <span class="m6-text">Revise os custos</span>
            </div>
            <div class="m6-item" id="m6-i2">
              <svg class="line-icon m6-check" viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="32" cy="32" r="29" pathLength="1" />
                <path d="M20 33l8 8l16-17" pathLength="1" />
              </svg>
              <span class="m6-text">Reorganize as escalas</span>
            </div>
            <div class="m6-item" id="m6-i3">
              <svg class="line-icon m6-check" viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="32" cy="32" r="29" pathLength="1" />
                <path d="M20 33l8 8l16-17" pathLength="1" />
              </svg>
              <span class="m6-text">Simule cenários</span>
            </div>
          </div>
          <div id="m6-sign"><img id="m6-logo" src="assets/axia-logo-white.svg" alt="Grupo Axia" /><span id="m6-url">grupoaxia.co</span></div>
        </div></div>
      </div>
    </div>
    <script src="assets/axia-kit.js"></script>
    <script>
      const V = AxiaKit.setup({ fundo: true, overlayY: 1240 });
      const tl = gsap.timeline({ paused: true });

      if (V.fundo) AxiaKit.bgIn(tl, 0);
      // 0,0–0,5 · título
      tl.fromTo("#m6-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo(["#m6-t1", "#m6-t2"], { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out", stagger: 0.08 }, 0.05);
      tl.fromTo("#m6-list", { borderTopColor: "rgba(255,255,255,0)" }, { borderTopColor: "rgba(255,255,255,0.14)", duration: 0.3 }, 0.3);
      // 0,5 / 1,0 / 1,5 · itens com check desenhado
      ["#m6-i1", "#m6-i2", "#m6-i3"].forEach((id, i) => {
        const t = 0.5 + i * 0.5;
        tl.fromTo(id, { borderBottomColor: "rgba(255,255,255,0)" }, { borderBottomColor: "rgba(255,255,255,0.14)", duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo(id + " circle", { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0.0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.35, ease: "power2.inOut" }, t);
        tl.fromTo(id + " path", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, t + 0.22);
        tl.fromTo(id + " .m6-text", { opacity: 0, x: -24, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t + 0.05);
      });
      tl.fromTo("#m6-sign", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.9);
      // 2,0–2,6 · estável · 2,6–3,0 · saída elegante
      tl.to(["#m6-t1", "#m6-t2"], { yPercent: -110, duration: 0.28, ease: "power3.in", stagger: 0.04 }, 2.6);
      tl.to(["#m6-i1", "#m6-i2", "#m6-i3", "#m6-sign"], { opacity: 0, y: -14, duration: 0.25, ease: "power2.in", stagger: 0.03 }, 2.62);
      tl.to("#m6-list", { borderTopColor: "rgba(255,255,255,0)", duration: 0.2 }, 2.65);
      if (!V.fundo) tl.to("#m6-panel", { opacity: 0, duration: 0.15, ease: "power2.in" }, 2.8);
      if (V.fundo) tl.to("#bg .bg-rule", { scaleX: 0, duration: 0.25, ease: "power2.in" }, 2.65);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
