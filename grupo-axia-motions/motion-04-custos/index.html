<!doctype html>
<!-- Grupo Axia · Motion 04 · Impacto nos custos · 2.3s · 1080×1920 · 30 fps -->
<html lang="pt-BR" data-composition-variables='[{"id": "fundo", "type": "boolean", "label": "Fundo sólido (insert de tela cheia)", "default": false}, {"id": "overlayY", "type": "number", "label": "Overlay: centro vertical do painel", "default": 1300, "min": 500, "max": 1500, "step": 10, "unit": "px"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Motion 04 · Impacto nos custos</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>

      #m4-top { position: relative; height: 1px; margin-bottom: 40px; }
      #m4-line { position: absolute; inset: 0; background: var(--hair); transform-origin: left center; }
      #m4-dot { position: absolute; left: 0; top: -5px; width: 11px; height: 11px; border-radius: 50%; background: var(--brand-200); }
      #m4-figure { display: inline-flex; align-items: baseline; gap: 24px; }
      #m4-ate { font-size: 56px; font-weight: 600; letter-spacing: 0.02em; }
      #m4-num { font-size: 240px; font-weight: 600; letter-spacing: -0.045em; line-height: 0.92; color: var(--brand-200); font-variant-numeric: tabular-nums; }
      #m4-bar { height: 8px; border-radius: 4px; background: var(--brand-200); margin-top: 28px; transform-origin: left center; }
      #m4-sub { font-size: 44px; font-weight: 600; letter-spacing: -0.01em; text-transform: uppercase; margin-top: 36px; line-height: 1.15; }
      #m4-note { margin-top: 20px; }
      .mode-full #m4-num { font-size: 300px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.3" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="2.3" data-track-index="0">
        <img class="bg-logo" src="assets/axia-logo-white.svg" alt="Grupo Axia" />
        <div class="bg-rule top"></div>
        <div class="bg-rule bottom"></div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="2.3" data-track-index="1">
        <div class="anchor"><div class="panel" id="m4-panel">
          <div id="m4-top"><div id="m4-line"></div><div id="m4-dot"></div></div>
          <div id="m4-block" style="display:inline-block">
            <div id="m4-figure"><span id="m4-ate">ATÉ</span><span id="m4-num">7%</span></div>
            <div id="m4-bar"></div>
          </div>
          <p id="m4-sub">Possível aumento de custos</p>
          <p class="note" id="m4-note">Estimativa citada no vídeo</p>
        </div></div>
      </div>
    </div>
    <script src="assets/axia-kit.js"></script>
    <script>
      const V = AxiaKit.setup({ fundo: false, overlayY: 1300 });
      const tl = gsap.timeline({ paused: true });

      if (V.fundo) AxiaKit.bgIn(tl, 0);
      // 0,0–0,4 · linha gráfica
      tl.fromTo("#m4-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo("#m4-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.02);
      tl.fromTo("#m4-dot", { x: 0, scale: 0 }, { scale: 1, duration: 0.2, ease: "power2.out" }, 0.02);
      tl.fromTo("#m4-ate", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.25);
      // 0,4–1,1 · contador 0 → 7
      const counter = { v: 0 };
      const num = document.getElementById("m4-num");
      tl.fromTo("#m4-num", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.4);
      tl.fromTo(counter, { v: 0 }, { v: 7, duration: 0.7, ease: "power2.out",
        onUpdate: () => { num.textContent = Math.round(counter.v) + "%"; } }, 0.4);
      // 1,1–1,6 · barra acompanha o número
      tl.fromTo("#m4-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.1);
      tl.fromTo("#m4-sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 1.15);
      tl.fromTo("#m4-note", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.35);
      // 1,6–2,0 · estável · 2,0–2,3 · saída
      tl.to("#m4-panel", { opacity: 0, y: -12, duration: 0.24, ease: "power2.in" }, 2.0);
      if (V.fundo) tl.to("#bg .bg-rule", { scaleX: 0, duration: 0.24, ease: "power2.in" }, 2.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
