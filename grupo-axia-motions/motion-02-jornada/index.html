<!doctype html>
<!-- Grupo Axia · Motion 02 · Redução da jornada · 2.0s · 1080×1920 · 30 fps -->
<html lang="pt-BR" data-composition-variables='[{"id": "fundo", "type": "boolean", "label": "Fundo sólido (insert de tela cheia)", "default": false}, {"id": "overlayY", "type": "number", "label": "Overlay: centro vertical do painel", "default": 1320, "min": 500, "max": 1500, "step": 10, "unit": "px"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Motion 02 · Redução da jornada</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>

      #m2-row { display: flex; align-items: center; justify-content: space-between; }
      .m2-num { font-size: 150px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
      #m2-old { color: var(--ink-soft); }
      #m2-new { color: var(--brand-200); transform-origin: center 60%; }
      #m2-arrow { width: 150px; height: 40px; stroke-width: 3; overflow: visible; }
      #m2-sub { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--hair); }
      .mode-full .m2-num { font-size: 170px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.0" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="2.0" data-track-index="0">
        <img class="bg-logo" src="assets/axia-logo-white.svg" alt="Grupo Axia" />
        <div class="bg-rule top"></div>
        <div class="bg-rule bottom"></div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="2.0" data-track-index="1">
        <div class="anchor"><div class="panel" id="m2-panel">
          <div id="m2-row">
            <div class="m2-num" id="m2-old">44h</div>
            <svg class="line-icon" id="m2-arrow" viewBox="0 0 150 40" aria-hidden="true">
              <path id="m2-shaft" d="M4 20H144" pathLength="1" />
              <path id="m2-head" d="M128 6L145 20L128 34" pathLength="1" />
            </svg>
            <div class="m2-num" id="m2-new">40h</div>
          </div>
          <div class="eyebrow" id="m2-sub">Redução da jornada em debate</div>
        </div></div>
      </div>
    </div>
    <script src="assets/axia-kit.js"></script>
    <script>
      const V = AxiaKit.setup({ fundo: false, overlayY: 1320 });
      const tl = gsap.timeline({ paused: true });

      if (V.fundo) AxiaKit.bgIn(tl, 0);
      // 0,0–0,35 · painel e 44h
      tl.fromTo("#m2-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo("#m2-old", { opacity: 0, x: -20, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, 0.05);
      // 0,35–0,8 · seta desenhada
      tl.fromTo("#m2-shaft", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 0.35);
      tl.fromTo("#m2-head", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, 0.6);
      // 0,8–1,3 · 40h com destaque
      tl.fromTo("#m2-new", { opacity: 0, scale: 0.94, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, 0.8);
      tl.fromTo("#m2-sub", { opacity: 0, borderTopColor: "rgba(255,255,255,0)" }, { opacity: 1, borderTopColor: "rgba(255,255,255,0.14)", duration: 0.35, ease: "power2.out" }, 0.95);
      // 1,3–1,8 · leitura · 1,8–2,0 · fade-out
      tl.to("#m2-panel", { opacity: 0, y: -10, duration: 0.17, ease: "power2.in" }, 1.8);
      if (V.fundo) tl.to("#bg .bg-rule", { scaleX: 0, duration: 0.17, ease: "power2.in" }, 1.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
