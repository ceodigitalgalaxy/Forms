<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diagnóstico inicial | Digital Galaxy</title>
  <meta name="description" content="Faça o diagnóstico inicial de marketing da Digital Galaxy: 10 perguntas rápidas sobre o seu negócio. Nossa equipe analisa as respostas e entra em contato.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://diagnostico.digitalgalaxy.com.br/">

  <!-- Compartilhamento (WhatsApp, Instagram, LinkedIn, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Digital Galaxy">
  <meta property="og:title" content="Diagnóstico inicial | Digital Galaxy">
  <meta property="og:description" content="10 perguntas rápidas sobre o seu negócio. Nossa equipe analisa e entra em contato.">
  <meta property="og:url" content="https://diagnostico.digitalgalaxy.com.br/">
  <meta property="og:image" content="https://diagnostico.digitalgalaxy.com.br/assets/og-diagnostico.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Diagnóstico inicial Digital Galaxy">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" id="favicon" href="assets/favicon.png">
  <link rel="apple-touch-icon" id="apple-icon" href="assets/favicon.png">
  <!-- Conexão antecipada com o Google Apps Script (envio mais rápido) -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <script src="config.js"></script>
</head>
<body>
  <canvas class="galaxy" id="galaxy" aria-hidden="true"></canvas>
  <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>

  <header class="brand">
    <a id="brand-link" class="brand__link" href="./" title="Recomeçar o formulário">
      <img id="brand-logo" class="brand__logo" src="" alt="">
      <span id="brand-name" class="brand__name"></span>
    </a>
  </header>

  <main>
    <form id="lead-form" novalidate>
      <!-- Perguntas (geradas a partir de config.js) -->
      <div id="steps"></div>

      <!-- Anti-spam (honeypot): invisível para humanos -->
      <div class="hp" aria-hidden="true">
        <label>Não preencha <input type="text" name="_hp" tabindex="-1" autocomplete="off"></label>
      </div>
    </form>

    <!-- Decolagem: a estrela da logo sobe ao enviar -->
    <div class="launch" id="launch" aria-hidden="true">
      <div class="launch__ship">
      <span class="launch__trail"></span>
      <svg class="launch__star" viewBox="0 0 24 24"><path d="M12 1.5c.5 0 .8.3.9.8.9 5 3.8 7.9 8.8 8.8.5.1.8.4.8.9s-.3.8-.8.9c-5 .9-7.9 3.8-8.8 8.8-.1.5-.4.8-.9.8s-.8-.3-.9-.8c-.9-5-3.8-7.9-8.8-8.8-.5-.1-.8-.4-.8-.9s.3-.8.8-.9c5-.9 7.9-3.8 8.8-8.8.1-.5.4-.8.9-.8Z" fill="currentColor"/></svg>
      </div>
    </div>

    <!-- Tela final -->
    <section id="success-view" class="step step--end" tabindex="-1" aria-live="polite">
      <div class="step__inner">
        <div class="end__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 id="success-title" class="welcome__title"></h2>
        <p id="success-message" class="welcome__text"></p>
      </div>
    </section>
  </main>

  <!-- Estrela da logo: link para o Instagram (aparece na tela final) -->
  <a id="social-star" class="star-link" href="#" target="_blank" rel="noopener" hidden>
    <span class="star-link__label" id="social-label"></span>
    <span class="star-link__btn">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 1.5c.5 0 .8.3.9.8.9 5 3.8 7.9 8.8 8.8.5.1.8.4.8.9s-.3.8-.8.9c-5 .9-7.9 3.8-8.8 8.8-.1.5-.4.8-.9.8s-.8-.3-.9-.8c-.9-5-3.8-7.9-8.8-8.8-.5-.1-.8-.4-.8-.9s.3-.8.8-.9c5-.9 7.9-3.8 8.8-8.8.1-.5.4-.8.9-.8Z" fill="currentColor"/>
      </svg>
    </span>
  </a>

  <nav class="nav" id="nav" aria-label="Navegação entre perguntas">
    <button type="button" class="nav__btn" id="nav-prev" aria-label="Pergunta anterior">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="nav__btn" id="nav-next" aria-label="Próxima pergunta">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <script src="assets/galaxy.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
